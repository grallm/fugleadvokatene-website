name: Deploy Astro production site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astro-production-deployment
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build static production site
        run: npx --no-install astro build
        env:
          SITE_URL: https://www.fugleadvokatene.no
          PUBLIC_PREVIEW: 'false'
      - run: npm run test:site
        env:
          SITE_URL: https://www.fugleadvokatene.no
          PUBLIC_PREVIEW: 'false'
      - name: Prepare static files only
        run: |
          rm -rf dist/api dist/admin
          find dist -type f \( -name '.*' -o -iname '*.php' -o -iname '*.ini' \) -delete
          node scripts/deploy-static.mjs --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: astro-production-${{ github.sha }}
          path: |
            dist/
            node_modules/basic-ftp/
          compression-level: 0
          retention-days: 14
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://www.fugleadvokatene.no
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: astro-production-${{ github.sha }}
          path: .
      - name: Upload static files through verified FTPS
        run: node scripts/deploy-static.mjs
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PUBLIC_DIR: /
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
