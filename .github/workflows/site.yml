name: Check, build and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, gd, fileinfo
          coverage: none
      - run: npm ci
      - run: npm run format:php:check
      - run: npm run check
      - name: Lint PHP
        run: find backend public/api scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm run test:php
      - run: npm test
      - name: Require complete assets before a live build
        if: vars.SITE_READY == 'true'
        run: node scripts/check-assets.mjs
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.fugleadvokatene.no' }}
          PUBLIC_PREVIEW: ${{ vars.SITE_READY == 'true' && 'false' || 'true' }}
      - run: npm run test:http
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: build/
          include-hidden-files: true
          retention-days: 14
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: build
      - name: Publish using FTPS
        run: npm run deploy
        env:
          DEPLOY_CONFIRM: 'true'
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PUBLIC_DIR: ${{ vars.FTP_PUBLIC_DIR }}
          FTP_PRIVATE_DIR: ${{ vars.FTP_PRIVATE_DIR }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
